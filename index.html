
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Student Registration Form</h1>
        <p>Please complete all required fields.</p>

        <form id="registrationForm">
            <h2>Personal Information</h2>

            <label for="studentId">Student ID </label>
            <input type="text" id="studentId" data-label="Student ID"
                data-error="Please enter your Student ID.">
            <small id="studentIdError" class="error-message"></small>

            <label for="fullName">Full Name </label>
            <input type="text" id="fullName" data-label="Full Name"
                data-error="Please enter your full name.">
            <small id="fullNameError" class="error-message"></small>

            <label for="email">Email Address </label>
            <input type="text" id="email" inputmode="email"
                data-label="Email" data-error="Please enter a valid email address.">
            <small id="emailError" class="error-message"></small>

            <label for="phone">Phone Number </label>
            <input type="tel" id="phone" placeholder="09XXXXXXXXX"
                data-label="Phone Number"
                data-error="Enter a valid number, e.g. 09123456789.">
            <small id="phoneError" class="error-message"></small>

            <label for="dob">Date of Birth </label>
            <input type="date" id="dob" data-label="Date of Birth"
                data-error="Please select your date of birth.">
            <small id="dobError" class="error-message"></small>

            <label for="gender">Gender </label>
            <select id="gender" data-label="Gender"
                data-error="Please select your gender.">
                <option value="">Select gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
            <small id="genderError" class="error-message"></small>

            <h2>Academic Information</h2>

            <label for="program">Program </label>
            <select id="program" data-label="Program"
                data-error="Please select your program.">
                <option value="">Select program</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Nursing</option>
                <option value="BSHM">BS Hospitality Management</option>
                <option value="BSBA">BS Tourism Management</option>
            </select>
            <small id="programError" class="error-message"></small>

            <label for="yearLevel">Year Level </label>
            <select id="yearLevel" data-label="Year Level"
                data-error="Please select your year level.">
                <option value="">Select year level</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
            <small id="yearLevelError" class="error-message"></small>

            <h2>Account Information</h2>

            <label for="password">Password </label>
            <input type="password" id="password"
                data-label="Password"
                data-error="Password must be at least 8 characters long.">
            <small id="passwordError" class="error-message"></small>

            <label for="confirmPassword">Confirm Password </label>
            <input type="password" id="confirmPassword"
                data-label="Confirm Password"
                data-error="Passwords do not match.">
            <small id="confirmPasswordError" class="error-message"></small>

            <button type="button" id="togglePassword" data-status="hidden">
                Show Passwords
            </button>

            <label for="address">Address </label>
            <textarea id="address" rows="3" data-label="Address"
                data-error="Please enter your address."></textarea>
            <small id="addressError" class="error-message"></small>

            <div class="agreement">
                <input type="checkbox" id="agreement">
                <label for="agreement">
                    I confirm that my information is correct. 
                </label>
            </div>
            <small id="agreementError" class="error-message"></small>

            <p id="successMessage" role="status"></p>

            <button type="submit">Submit Registration</button>
            <button type="reset" id="resetButton">Reset Form</button>

            <p class="note">
                This form demonstrates front-end validation. It does not save
                student information to a database.
            </p>
        </form>
    </main>
</body>
</html>
